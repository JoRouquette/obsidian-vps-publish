# vps-publish/.github/workflows/release.yml
# Miroir en lecture seule : lint / test / build uniquement.
# Plus de semantic-release ici — le monorepo est la seule source de vérité
# (versions + GitHub Release). Pensez à supprimer .releaserc.json de ce dépôt.
name: CI (mirror — read-only)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22.14.0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Le miroir vps-publish embarque désormais un package-lock.json versionné
      # (exigé par la vérification de build de la revue automatisée du répertoire).
      # ⚠️ PAS de --legacy-peer-deps : le répertoire lance un `npm ci` nu. Ce drapeau
      # a masqué en 6.23.0 un lockfile généré sans les peers CodeMirror d'obsidian,
      # et la revue est tombée en « lockfile out of date » + build verification KO.
      # Cette commande doit rester identique à celle du répertoire, sinon la CI du
      # miroir ne détecte plus la panne qu'elle est censée prévenir.
      - run: npm ci --no-audit --no-fund
      # Lint/test informatifs : la qualité est garantie en amont par le monorepo.
      # Ne pas bloquer le merge (le miroir ne peut pas être corrigé sans être écrasé au sync).
      - run: npm run lint
        continue-on-error: true
      - run: npm run test
        continue-on-error: true
      - run: npm run build
