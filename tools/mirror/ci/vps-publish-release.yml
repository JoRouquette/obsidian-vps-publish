# vps-publish/.github/workflows/release.yml
# Miroir en lecture seule : lint / test / build uniquement.
# Plus de semantic-release ici — le monorepo est la seule source de vérité
# (versions + GitHub Release). Pensez à supprimer .releaserc.json de ce dépôt.
name: CI (mirror — read-only)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22.14.0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Le miroir vps-publish embarque désormais un package-lock.json versionné
      # (exigé par la vérification de build de la revue automatisée du répertoire).
      # ⚠️ PAS de --legacy-peer-deps : le répertoire lance un `npm ci` nu. Ce drapeau
      # a masqué en 6.23.0 un lockfile généré sans les peers CodeMirror d'obsidian,
      # et la revue est tombée en « lockfile out of date » + build verification KO.
      # Cette commande doit rester identique à celle du répertoire, sinon la CI du
      # miroir ne détecte plus la panne qu'elle est censée prévenir.
      - run: npm ci --no-audit --no-fund
      # Lint/test informatifs : la qualité est garantie en amont par le monorepo.
      # Ne pas bloquer le merge (le miroir ne peut pas être corrigé sans être écrasé au sync).
      - run: npm run lint
        continue-on-error: true
      - run: npm run test
        continue-on-error: true
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-build
          path: |
            main.js
            styles.css
            manifest.json
          if-no-files-found: error
          retention-days: 1

  # La revue du répertoire Obsidian cherche l'attestation sur CE dépôt (le miroir), pas
  # sur le monorepo. Le build étant reproductible, l'empreinte de ces fichiers est celle
  # des assets que le monorepo publie dans la release (voir sync-mirrors.yml).
  # La signature vit dans un job à part : `quality` exécute les scripts des dépendances
  # (npm ci, lint, test, build) et ne reçoit donc aucun droit OIDC.
  attest:
    name: Attest build provenance
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-build
          path: plugin-build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            plugin-build/main.js
            plugin-build/styles.css
            plugin-build/manifest.json
