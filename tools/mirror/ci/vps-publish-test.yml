# vps-publish/.github/workflows/test.yml
# CI miroir informative (le monorepo est la source de vérité : qualité + release).
# On garde le job `lint_test` (même nom, au cas où il serait un check requis),
# avec lint/test non bloquants. Le lockfile est versionné depuis la 6.23.0 :
# l'install se fait donc en `npm ci` nu, comme la vérification de build du
# répertoire — surtout pas en --legacy-peer-deps, qui masquerait un lock amputé
# de ses peers (la panne de la revue 6.23.0).
name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
        continue-on-error: true
      - run: npm run test
        continue-on-error: true
